[package]
name = "ansa"
version = "0.1.0"
edition = "2021"
description = "A tiny single point for agents to exchange messages"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
terminal_size = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
