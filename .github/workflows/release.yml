name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ansa
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  package-linux:
    name: Package deb/rpm (${{ matrix.target }})
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross,cargo-deb,cargo-generate-rpm
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
      - name: Build .deb
        run: |
          mkdir -p dist
          cargo deb --no-build --no-strip --target ${{ matrix.target }} -o dist/
      - name: Build .rpm
        run: cargo generate-rpm --target ${{ matrix.target }} -o dist/
      - name: Checksums
        run: |
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Upload to release
        run: gh release upload "$GITHUB_REF_NAME" dist/*

  package-windows:
    name: Package MSI (x86_64)
    needs: create-release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix
      - name: Install WiX toolset
        run: |
          choco install wixtoolset --no-progress -y
          $bin = Get-Item "C:\Program Files (x86)\WiX Toolset v*\bin" | Select-Object -Last 1
          Add-Content $env:GITHUB_PATH $bin.FullName
      - name: Build
        run: cargo build --release
      - name: Build .msi
        run: |
          mkdir dist
          cargo wix --no-build --nocapture --output dist/
      - name: Checksums and upload
        shell: bash
        run: |
          cd dist
          for f in *.msi; do sha256sum "$f" > "$f.sha256"; done
          gh release upload "$GITHUB_REF_NAME" *

  package-macos:
    name: Package pkg (${{ matrix.target }})
    needs: create-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build .pkg
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p pkgroot/usr/local/bin dist
          cp "target/${{ matrix.target }}/release/ansa" pkgroot/usr/local/bin/
          xattr -cr pkgroot
          pkgbuild \
            --root pkgroot \
            --identifier io.interpretica.ansa \
            --version "$version" \
            --install-location / \
            "dist/ansa-$version-${{ matrix.target }}.pkg"
      - name: Checksums and upload
        run: |
          cd dist
          for f in *.pkg; do shasum -a 256 "$f" > "$f.sha256"; done
          gh release upload "$GITHUB_REF_NAME" *
